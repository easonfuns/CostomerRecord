<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健康管家 · 管理平台</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --moss:#1e3d30;--moss2:#2d4a3e;--moss3:#3d6b59;--moss-pale:#eef5f0;
  --gold:#c9a84c;--gold-pale:#fdf3d6;
  --cream:#f8f5ef;--warm:#fdfbf7;
  --ink:#1a1a18;--muted:#6b6b66;--hint:#a8a8a2;
  --border:#e8e4dc;--border2:#d0cbc0;
  --r:12px;--r2:16px;--header-h:56px;
  --shadow:0 2px 12px rgba(30,61,48,.07);
  --shadow2:0 6px 24px rgba(30,61,48,.12);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'Noto Sans TC',sans-serif;background:var(--cream);color:var(--ink);
     height:100vh;display:flex;flex-direction:column;overflow:hidden;}

/* ══ 載入畫面 ══ */
#boot{position:fixed;inset:0;z-index:500;background:var(--cream);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
.boot-logo{font-size:38px;animation:bpulse 1.6s ease-in-out infinite;}
@keyframes bpulse{0%,100%{opacity:.35;transform:scale(.96);}50%{opacity:1;transform:scale(1);}}
.boot-text{font-size:13px;color:var(--hint);letter-spacing:.1em;}

/* ══ 全畫面卡片（登入／待開通）══ */
.fullscreen{position:fixed;inset:0;z-index:200;background:var(--cream);
            display:flex;align-items:center;justify-content:center;padding:1.5rem 1rem;overflow-y:auto;}
.fs-card{width:100%;max-width:420px;border-radius:20px;overflow:hidden;
         box-shadow:var(--shadow2);background:var(--warm);margin:auto;}
.fs-hero{background:var(--moss);padding:2.25rem 1.5rem 3rem;text-align:center;position:relative;}
.fs-hero::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:36px;
                background:var(--warm);clip-path:ellipse(55% 100% at 50% 100%);pointer-events:none;}
.fs-mark{width:54px;height:54px;border-radius:15px;background:rgba(255,255,255,.1);
         border:1px solid rgba(255,255,255,.15);display:flex;align-items:center;
         justify-content:center;margin:0 auto 14px;font-size:24px;}
.fs-title{font-family:'Noto Serif TC',serif;font-size:22px;font-weight:600;color:#fff;
          letter-spacing:.06em;margin-bottom:4px;}
.fs-sub{font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.12em;}
.fs-body{padding:1.75rem 1.5rem 2rem;position:relative;z-index:1;}

/* ══ Google 登入按鈕 ══ */
.gbtn{width:100%;height:50px;border:1.5px solid var(--border2);border-radius:12px;
      background:#fff;color:var(--ink);font-size:15px;font-weight:600;
      font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all .15s;
      display:flex;align-items:center;justify-content:center;gap:11px;}
.gbtn:hover:not(:disabled){border-color:var(--moss3);box-shadow:0 3px 12px rgba(30,61,48,.1);}
.gbtn:disabled{opacity:.55;cursor:not-allowed;}
.gmark{width:20px;height:20px;flex-shrink:0;}
.fs-hint{text-align:center;font-size:12px;color:var(--hint);margin-top:16px;line-height:1.9;}

/* ══ 待開通 ══ */
.pend-profile{display:flex;align-items:center;gap:12px;padding:14px;
              background:var(--moss-pale);border:1.5px solid var(--moss3);
              border-radius:12px;margin-bottom:1.25rem;}
.pend-avatar{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:var(--gold);
             display:flex;align-items:center;justify-content:center;font-weight:700;
             color:var(--moss);font-size:17px;overflow:hidden;}
.pend-avatar img{width:100%;height:100%;object-fit:cover;}
.pend-name{font-size:15px;font-weight:600;}
.pend-mail{font-size:12px;color:var(--muted);margin-top:1px;word-break:break-all;}
.pend-box{padding:16px;border-radius:12px;font-size:13px;line-height:1.9;margin-bottom:1.25rem;}
.pend-box.wait{background:var(--gold-pale);border:1.5px solid #f0d080;color:#7a5500;}
.pend-box.off{background:#fff5f5;border:1.5px solid #f5c6cb;color:#8a3a3a;}
.pend-box strong{font-weight:700;display:block;margin-bottom:4px;font-size:14px;}

/* ══ Header ══ */
.app-header{position:relative;z-index:100;background:var(--moss);height:var(--header-h);
            display:flex;align-items:center;justify-content:space-between;padding:0 1rem;flex-shrink:0;}
.ah-brand{display:flex;align-items:center;gap:9px;flex-shrink:0;}
.ah-logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.12);
         display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.ah-name{font-family:'Noto Serif TC',serif;font-size:15px;font-weight:600;color:#fff;
         letter-spacing:.04em;line-height:1.2;}
.ah-sub{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.08em;}
.ah-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.user-pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);
           border:1px solid rgba(255,255,255,.15);border-radius:99px;padding:4px 11px 4px 5px;}
.user-avatar{width:26px;height:26px;border-radius:50%;background:var(--gold);display:flex;
             align-items:center;justify-content:center;font-size:11px;font-weight:700;
             color:var(--moss);flex-shrink:0;overflow:hidden;}
.user-avatar img{width:100%;height:100%;object-fit:cover;}
.user-name-text{font-size:12px;color:#fff;font-weight:500;line-height:1.2;}
.user-id-text{font-size:10px;color:rgba(255,255,255,.45);line-height:1.2;}
.ah-badge{font-size:10px;padding:2px 8px;border-radius:99px;background:rgba(201,168,76,.25);
          color:var(--gold);font-weight:600;border:1px solid rgba(201,168,76,.3);white-space:nowrap;}
.ah-btn{height:28px;padding:0 10px;border:1px solid rgba(255,255,255,.2);border-radius:6px;
        background:none;color:rgba(255,255,255,.65);font-size:12px;
        font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap;}
.ah-btn:hover{background:rgba(255,255,255,.1);color:#fff;}

/* ══ 常用連結 ══ */
.quicklinks{background:var(--warm);border-bottom:1.5px solid var(--border);padding:8px 1rem;
            display:flex;gap:7px;align-items:center;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.quicklinks::-webkit-scrollbar{display:none;}
.ql-label{font-size:10px;font-weight:700;color:var(--hint);text-transform:uppercase;
          letter-spacing:.1em;flex-shrink:0;margin-right:3px;}
.ql-btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;
        border:1.5px solid var(--border2);border-radius:99px;background:#fff;color:var(--ink);
        font-size:12px;font-weight:500;font-family:'Noto Sans TC',sans-serif;cursor:pointer;
        white-space:nowrap;flex-shrink:0;transition:all .15s;text-decoration:none;}
.ql-btn:hover{border-color:var(--moss3);background:var(--moss-pale);color:var(--moss2);transform:translateY(-1px);}
.ql-ext{font-size:9px;color:var(--hint);}

/* ══ 主內容 ══ */
#app-main{flex:1;overflow-y:auto;}
.content{max-width:820px;margin:0 auto;padding:1.25rem 1rem 3rem;}

/* ══ 分頁 ══ */
.tabs{display:flex;gap:4px;margin-bottom:1.25rem;padding:3px;background:rgba(0,0,0,.06);
      border-radius:10px;width:fit-content;flex-wrap:wrap;}
.tab{padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer;border:none;background:none;
     color:#3a3a35;border-radius:8px;transition:all .15s;font-family:'Noto Sans TC',sans-serif;}
.tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600;}

/* ══ 卡片 / 元件 ══ */
.card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r2);
      padding:1.25rem;margin-bottom:1rem;}
.card-title{font-size:10px;font-weight:700;color:var(--hint);margin-bottom:1rem;
            text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;
            justify-content:space-between;gap:10px;}
.card-title .cnt{background:var(--gold);color:#fff;padding:2px 9px;border-radius:99px;font-size:11px;}
.btn{height:36px;padding:0 16px;border-radius:var(--r);font-size:13px;font-weight:500;
     cursor:pointer;border:1.5px solid var(--border2);background:#fff;color:var(--ink);
     font-family:'Noto Sans TC',sans-serif;transition:all .15s;display:inline-flex;
     align-items:center;gap:5px;white-space:nowrap;}
.btn:hover:not(:disabled){background:var(--cream);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.primary{background:var(--moss2);color:#fff;border-color:var(--moss2);}
.btn.primary:hover:not(:disabled){background:var(--moss);}
.btn.sm{height:30px;padding:0 11px;font-size:12px;}
.btn.xs{height:26px;padding:0 9px;font-size:11px;}
.btn.danger{color:#c0392b;border-color:#f5c6cb;}
.btn.danger:hover:not(:disabled){background:#fff5f5;}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold);}
.btn.gold:hover:not(:disabled){background:#b8973f;}
.btn.full{width:100%;justify-content:center;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:12px;color:var(--muted);font-weight:500;}
.field input,.field select,.field textarea{border:1.5px solid var(--border2);border-radius:var(--r);
    padding:0 12px;font-size:14px;font-family:'Noto Sans TC',sans-serif;background:#fff;
    color:var(--ink);width:100%;}
.field input,.field select{height:40px;}
.field input:focus,.field select:focus{outline:none;border-color:var(--moss2);
    box-shadow:0 0 0 3px rgba(45,74,62,.09);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.alert{padding:11px 15px;border-radius:10px;font-size:13px;margin-bottom:12px;}
.alert.success{background:#e8f4e0;color:#2a6e10;border:1px solid #9fd87e;}
.alert.error{background:#fef0f0;color:#c0392b;border:1px solid #f5c6cb;}
.alert.info{background:var(--gold-pale);color:#7a5500;border:1px solid #f0d080;}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--hint);font-size:14px;line-height:1.9;}

/* ══ 待開通申請卡 ══ */
.pending-card{background:var(--gold-pale);border:1.5px solid #f0d080;border-radius:var(--r2);
              padding:1.125rem 1.25rem;margin-bottom:10px;}
.pc-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.pc-avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;background:var(--moss2);
           display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;
           font-size:16px;overflow:hidden;}
.pc-avatar img{width:100%;height:100%;object-fit:cover;}
.pc-name{font-size:15px;font-weight:600;}
.pc-meta{font-size:11.5px;color:var(--muted);margin-top:2px;word-break:break-all;}
.pc-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.pc-form .field{margin-bottom:0;}
.pc-actions{display:flex;gap:8px;justify-content:flex-end;}

/* ══ 帳號列 ══ */
.acc-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
.acc-row:last-child{border-bottom:none;}
.acc-avatar{width:38px;height:38px;border-radius:50%;flex-shrink:0;background:var(--moss-pale);
            display:flex;align-items:center;justify-content:center;color:var(--moss2);
            font-weight:700;font-size:15px;overflow:hidden;}
.acc-avatar img{width:100%;height:100%;object-fit:cover;}
.acc-info{flex:1;min-width:0;}
.acc-name{font-size:14px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.acc-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
.acc-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.rtag{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600;}
.rtag.superadmin{background:#2d4a3e;color:var(--gold);}
.rtag.admin{background:var(--moss-pale);color:var(--moss2);}
.rtag.leader{background:#e8f0f5;color:#1a4a6e;}
.rtag.dealer{background:var(--cream);color:var(--muted);}
.rtag.disabled{background:#fff0f0;color:#c0392b;}

/* ══ 客戶卡 ══ */
.customer-list{display:flex;flex-direction:column;gap:8px;}
.customer-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r2);
               padding:1rem 1.125rem;transition:all .15s;cursor:pointer;}
.customer-card:hover{border-color:var(--moss3);box-shadow:0 3px 14px rgba(30,61,48,.09);}
.cc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px;gap:10px;}
.cc-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.cc-meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;}
.cc-tasks{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.task-pill{font-size:11px;padding:3px 10px;border-radius:99px;font-weight:500;}
.task-pill.done{background:#e8f4e0;color:#2a6e10;}
.task-pill.todo{background:var(--cream);color:var(--hint);}
.cc-tags{display:flex;gap:5px;flex-wrap:wrap;}
.htag{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--moss-pale);color:var(--moss2);}
.inv-tag{font-size:11px;padding:3px 11px;border-radius:99px;font-weight:500;white-space:nowrap;}
.inv-tag.booked{background:#e8f4e0;color:#2a6e10;}
.inv-tag.maybe{background:var(--gold-pale);color:#7a5500;}
.inv-tag.refused,.inv-tag.none{background:var(--cream);color:var(--muted);}
.tag-inquiry{font-size:10px;padding:2px 8px;border-radius:99px;background:var(--gold-pale);
             color:#7a5500;border:1px solid #f0d080;font-weight:600;}

/* ══ 統計 ══ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem;}
.stat-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r2);padding:.875rem 1rem;}
.stat-num{font-family:'Noto Serif TC',serif;font-size:24px;font-weight:600;line-height:1.1;margin-bottom:3px;}
.stat-unit{font-size:14px;font-weight:400;color:var(--muted);}
.stat-label{font-size:12px;color:var(--hint);}

/* ══ 同步列 ══ */
.sync-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;
          background:var(--cream);border:1.5px solid var(--border);border-radius:10px;
          margin-bottom:12px;font-size:12px;color:var(--muted);}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#3b6d11;display:inline-block;margin-right:5px;}
.sync-dot.syncing{background:var(--gold);animation:pulse 1s ease-in-out infinite;}
.sync-dot.error{background:#c0392b;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
@keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}

@media(max-width:560px){
  .field-row,.pc-form{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .ql-label{display:none;}
  .ah-sub{display:none;}
  .acc-row{flex-wrap:wrap;}
  .acc-actions{width:100%;justify-content:flex-start;}
}
</style>
</head>
<body>

<!-- ══════════ 載入中 ══════════ -->
<div id="boot">
  <div class="boot-logo">🌿</div>
  <div class="boot-text">載入中…</div>
</div>

<!-- ══════════ 登入畫面 ══════════ -->
<div id="screen-login" class="fullscreen" style="display:none">
  <div class="fs-card">
    <div class="fs-hero">
      <div class="fs-mark">🌿</div>
      <div class="fs-title">健康管家</div>
      <div class="fs-sub">管理平台</div>
    </div>
    <div class="fs-body">
      <div id="login-alert"></div>
      <button class="gbtn" id="gbtn" onclick="doGoogleLogin()">
        <svg class="gmark" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        使用 Google 帳號登入
      </button>
      <div class="fs-hint">
        第一次使用請先登入<br>
        再由管理員為您開通權限
      </div>
    </div>
  </div>
</div>

<!-- ══════════ 待開通／已停用 ══════════ -->
<div id="screen-pending" class="fullscreen" style="display:none">
  <div class="fs-card">
    <div class="fs-hero">
      <div class="fs-mark">🌿</div>
      <div class="fs-title">健康管家</div>
      <div class="fs-sub">管理平台</div>
    </div>
    <div class="fs-body">
      <div class="pend-profile">
        <div class="pend-avatar" id="pend-avatar">-</div>
        <div>
          <div class="pend-name" id="pend-name">-</div>
          <div class="pend-mail" id="pend-mail">-</div>
        </div>
      </div>
      <div id="pend-status"></div>
      <button class="btn full" onclick="location.reload()" style="margin-bottom:8px;">重新檢查</button>
      <button class="btn full" onclick="doLogout()">登出</button>
    </div>
  </div>
</div>

<!-- ══════════ 主系統 ══════════ -->
<div id="screen-app" style="display:none;flex-direction:column;height:100%;">

  <div class="app-header">
    <div class="ah-brand">
      <div class="ah-logo">🌿</div>
      <div>
        <div class="ah-name">健康管家</div>
        <div class="ah-sub">管理平台</div>
      </div>
    </div>
    <div class="ah-right">
      <div class="user-pill">
        <div class="user-avatar" id="hd-avatar">-</div>
        <div>
          <div class="user-name-text" id="hd-name">-</div>
          <div class="user-id-text" id="hd-team"></div>
        </div>
      </div>
      <span class="ah-badge" id="hd-role">-</span>
      <button class="ah-btn" onclick="doLogout()">登出</button>
    </div>
  </div>

  <div class="quicklinks">
    <span class="ql-label">常用連結</span>
    <a class="ql-btn" href="https://www.grace99.com.tw/order/" target="_blank" rel="noopener noreferrer">🛒 恩久下單系統<span class="ql-ext">↗</span></a>
    <a class="ql-btn" href="https://ig-hma.org/" target="_blank" rel="noopener noreferrer">🏛 健康管理協會<span class="ql-ext">↗</span></a>
    <a class="ql-btn" href="https://easonfuns.github.io/class/" target="_blank" rel="noopener noreferrer">📚 每周線上課程<span class="ql-ext">↗</span></a>
    <a class="ql-btn" href="https://novaxverse.co/" target="_blank" rel="noopener noreferrer">🌌 知能宇宙課程<span class="ql-ext">↗</span></a>
  </div>

  <div id="app-main">
    <div class="content">
      <div id="main-alert"></div>

      <div class="sync-bar">
        <div><span class="sync-dot" id="sync-dot"></span><span id="sync-text">已同步</span></div>
        <button class="btn sm" onclick="reloadAll()"><span id="sync-icon">↻</span> 重新整理</button>
      </div>

      <div class="tabs" id="main-tabs"></div>

      <!-- 我的客戶 -->
      <div id="tab-customers" class="tab-panel">
        <div class="stat-grid" id="my-stats"></div>
        <div id="customer-list" class="customer-list"></div>
      </div>

      <!-- 帳號管理 -->
      <div id="tab-accounts" class="tab-panel" style="display:none">
        <div class="card">
          <div class="card-title">待開通申請 <span class="cnt" id="pending-count">0</span></div>
          <div id="pending-list"></div>
        </div>
        <div class="card">
          <div class="card-title">已開通帳號 <span class="cnt" id="active-count">0</span></div>
          <div id="active-list"></div>
        </div>
        <div class="card">
          <div class="card-title">託管中的客戶 <span class="cnt" id="custody-count">0</span></div>
          <div id="custody-panel"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where,
  getDocs, orderBy, writeBatch, serverTimestamp, addDoc, enableIndexedDbPersistence
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ══════════════ Firebase ══════════════
const firebaseConfig = {
  apiKey: "AIzaSyBrD0VNBFMXcuUwdHo3EEgkN8W5qClnolE",
  authDomain: "health-steward.firebaseapp.com",
  projectId: "health-steward",
  storageBucket: "health-steward.firebasestorage.app",
  messagingSenderId: "500769843652",
  appId: "1:500769843652:web:145b7ebaea1ed231b45c91"
};
const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

// 離線快取（失敗不影響運作）
enableIndexedDbPersistence(db).catch(()=>{});

const CUSTODY_ID = 'CUSTODY';

// ══════════════ 狀態 ══════════════
let ME = null;          // users/{uid} 的資料
let MY_UID = null;
let customers = [];
let dealers = [];
let teams = [];
let allUsers = [];
let currentTab = 'customers';

// ══════════════ 工具 ══════════════
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fmtDate(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  if(isNaN(d.getTime())) return '';
  return d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
}
function initial(name){ return (name||'?')[0].toUpperCase(); }
function avatarHtml(photo, name){
  return photo ? `<img src="${esc(photo)}" alt="" referrerpolicy="no-referrer">` : esc(initial(name));
}
function showAlert(type, msg, zone='main-alert'){
  const el = $(zone); if(!el) return;
  el.innerHTML = `<div class="alert ${type}">${msg}</div>`;
  if(type !== 'error') setTimeout(()=>{ if(el) el.innerHTML=''; }, 4000);
}
function setSync(state, detail){
  const dot=$('sync-dot'), txt=$('sync-text'), icon=$('sync-icon');
  if(dot) dot.className = 'sync-dot'+(state==='syncing'?' syncing':state==='error'?' error':'');
  if(txt) txt.textContent = state==='syncing' ? '同步中…'
                          : state==='error'   ? (detail||'同步失敗')
                          : '已同步 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})
                            + (detail?' · '+detail:'');
  if(icon) icon.style.animation = state==='syncing' ? 'spin 1s linear infinite' : '';
}
function showScreen(name){
  $('boot').style.display = 'none';
  $('screen-login').style.display   = name==='login'   ? 'flex' : 'none';
  $('screen-pending').style.display = name==='pending' ? 'flex' : 'none';
  $('screen-app').style.display     = name==='app'     ? 'flex' : 'none';
}

// ══════════════ 登入 ══════════════
window.doGoogleLogin = async function(){
  const btn = $('gbtn');
  btn.disabled = true;
  try{
    await signInWithPopup(auth, new GoogleAuthProvider());
  }catch(e){
    btn.disabled = false;
    const map = {
      'auth/unauthorized-domain':'此網域尚未授權，請聯繫管理員',
      'auth/popup-blocked':'瀏覽器擋住了登入視窗，請允許彈出視窗後再試',
      'auth/popup-closed-by-user':'登入視窗被關閉，請再試一次',
      'auth/operation-not-allowed':'Google 登入尚未啟用，請聯繫管理員'
    };
    showAlert('error', map[e.code] || esc(e.message||e), 'login-alert');
  }
};

window.doLogout = async function(){
  await signOut(auth);
  location.reload();
};

// ══════════════ 認證狀態 ══════════════
onAuthStateChanged(auth, async (user) => {
  if(!user){ showScreen('login'); return; }

  MY_UID = user.uid;
  $('pend-avatar').innerHTML = avatarHtml(user.photoURL, user.displayName);
  $('pend-name').textContent = user.displayName || '（未提供名稱）';
  $('pend-mail').textContent = user.email;

  try{
    const ref  = doc(db,'users',user.uid);
    let snap   = await getDoc(ref);

    // 第一次登入 → 建立 pending 紀錄
    if(!snap.exists()){
      await setDoc(ref, {
        email: user.email || '',
        displayName: user.displayName || '',
        photoURL: user.photoURL || '',
        role: 'pending',
        status: 'pending',
        dealerId: null,
        dealerName: '',
        team: null,
        note: '',
        createdAt: serverTimestamp()
      });
      snap = await getDoc(ref);
    }

    ME = snap.data();

    if(ME.status !== 'active'){
      renderPendingScreen();
      showScreen('pending');
      return;
    }

    await bootApp(user);

  }catch(e){
    $('pend-status').innerHTML =
      `<div class="pend-box off"><strong>無法讀取權限資料</strong>${esc(e.message||e)}</div>`;
    showScreen('pending');
  }
});

function renderPendingScreen(){
  const box = $('pend-status');
  if(ME.status === 'disabled'){
    box.innerHTML = `<div class="pend-box off">
      <strong>帳號已停用</strong>
      此帳號目前無法使用系統。<br>如有疑問請聯繫管理員。
    </div>`;
  }else{
    box.innerHTML = `<div class="pend-box wait">
      <strong>⏳ 等待開通</strong>
      您的申請已送出，請聯繫管理員為您開通權限。<br>
      開通後按「重新檢查」即可開始使用。
    </div>`;
  }
}

// ══════════════ 啟動主系統 ══════════════
async function bootApp(user){
  $('hd-avatar').innerHTML = avatarHtml(user.photoURL, ME.dealerName || user.displayName);
  $('hd-name').textContent = ME.dealerName || user.displayName || '';
  $('hd-team').textContent = ME.team || '';
  $('hd-role').textContent = roleLabel(ME.role);

  renderTabs();
  showScreen('app');
  await reloadAll();
}

function roleLabel(r){
  return {superadmin:'最高管理員', admin:'管理員', leader:'團隊長', dealer:'健管師'}[r] || r;
}
function isAdmin(){ return ME && (ME.role==='admin' || ME.role==='superadmin'); }
function isSuper(){ return ME && ME.role==='superadmin'; }

function renderTabs(){
  const tabs = [{k:'customers', l: isAdmin() ? '所有客戶' : '我的客戶'}];
  if(isAdmin()) tabs.push({k:'accounts', l:'帳號管理'});
  $('main-tabs').innerHTML = tabs.map(t =>
    `<button class="tab ${t.k===currentTab?'active':''}" data-tab="${t.k}">${t.l}</button>`
  ).join('');
  $('main-tabs').querySelectorAll('.tab').forEach(b => {
    b.onclick = () => switchTab(b.dataset.tab);
  });
}

function switchTab(k){
  currentTab = k;
  $('tab-customers').style.display = k==='customers' ? 'block' : 'none';
  $('tab-accounts').style.display  = k==='accounts'  ? 'block' : 'none';
  $('main-tabs').querySelectorAll('.tab').forEach(b =>
    b.classList.toggle('active', b.dataset.tab===k));
}

// ══════════════ 載入資料 ══════════════
window.reloadAll = async function(){
  setSync('syncing');
  const t0 = Date.now();
  try{
    await Promise.all([loadCustomers(), loadDealersTeams(), isAdmin()?loadUsers():Promise.resolve()]);
    renderCustomers();
    if(isAdmin()) renderAccounts();
    setSync('ok', ((Date.now()-t0)/1000).toFixed(1)+'秒');
  }catch(e){
    setSync('error');
    showAlert('error','載入失敗：'+esc(e.message||e));
  }
};

async function loadCustomers(){
  let q;
  if(isAdmin()){
    q = query(collection(db,'customers'));
  }else if(ME.dealerId){
    q = query(collection(db,'customers'), where('did','==',ME.dealerId));
  }else{
    customers = []; return;
  }
  const snap = await getDocs(q);
  customers = snap.docs.map(d => ({ id:d.id, ...d.data() }));
}

async function loadDealersTeams(){
  const [ds, ts] = await Promise.all([
    getDocs(collection(db,'dealers')),
    getDocs(collection(db,'teams'))
  ]);
  dealers = ds.docs.map(d => ({ id:d.id, ...d.data() }));
  teams   = ts.docs.map(d => ({ id:d.id, ...d.data() }));
}

async function loadUsers(){
  const snap = await getDocs(collection(db,'users'));
  allUsers = snap.docs.map(d => ({ uid:d.id, ...d.data() }));
}

// ══════════════ 客戶列表 ══════════════
function renderCustomers(){
  // 統計
  const total = customers.length;
  const t1 = customers.filter(c=>c.task1).length;
  const t2 = customers.filter(c=>c.task2).length;
  const t3 = customers.filter(c=>c.task3).length;
  $('my-stats').innerHTML = `
    <div class="stat-card"><div class="stat-num" style="color:var(--moss2)">${total}<span class="stat-unit">位</span></div><div class="stat-label">客戶總數</div></div>
    <div class="stat-card"><div class="stat-num">${t1}<span class="stat-unit">位</span></div><div class="stat-label">7日產品</div></div>
    <div class="stat-card"><div class="stat-num">${t2}<span class="stat-unit">位</span></div><div class="stat-label">週二課程</div></div>
    <div class="stat-card"><div class="stat-num">${t3}<span class="stat-unit">位</span></div><div class="stat-label">小組活動</div></div>`;

  const list = $('customer-list');
  if(!customers.length){
    list.innerHTML = `<div class="empty">尚無客戶紀錄${ME.dealerId?'':'<br><span style="font-size:12px;">您的帳號尚未綁定經銷商編號</span>'}</div>`;
    return;
  }

  const sorted = [...customers].sort((a,b) => {
    const av = a.updatedAt?.toMillis?.() || 0;
    const bv = b.updatedAt?.toMillis?.() || 0;
    return bv - av;
  });

  list.innerHTML = sorted.map(c => {
    const tasks = [
      {l:'7日產品', d:c.task1},
      {l:'週二課程', d:c.task2},
      {l:'小組活動', d:c.task3}
    ].map(t => `<span class="task-pill ${t.d?'done':'todo'}">${t.d?'✓':'·'} ${t.l}</span>`).join('');

    const hs = (c.healthConcerns||[]).slice(0,4)
      .map(h=>`<span class="htag">${esc(h)}</span>`).join('');
    const more = (c.healthConcerns||[]).length > 4
      ? `<span class="htag">+${c.healthConcerns.length-4}</span>` : '';

    const invCls = {'已報名':'booked','考慮中':'maybe','拒絕':'refused'}[c.invitationStatus] || 'none';
    const inv = c.invitationStatus
      ? `<span class="inv-tag ${invCls}">${esc(c.invitationStatus)}</span>` : '';

    const meta = [];
    if(isAdmin() && c.dname) meta.push(esc(c.dname));
    if(c.saleDate) meta.push('恩典卡 '+fmtDate(c.saleDate));
    if(c.contactPhone) meta.push('📞 '+esc(c.contactPhone));

    return `<div class="customer-card">
      <div class="cc-top">
        <div>
          <div class="cc-name">${esc(c.cname||'(未命名)')}
            ${c.source==='inquiry'?'<span class="tag-inquiry">客戶自填</span>':''}
          </div>
          ${meta.length?`<div class="cc-meta">${meta.join(' · ')}</div>`:''}
        </div>
        ${inv}
      </div>
      <div class="cc-tasks">${tasks}</div>
      ${hs?`<div class="cc-tags">${hs}${more}</div>`:''}
    </div>`;
  }).join('');
}

// ══════════════ 帳號管理 ══════════════
function renderAccounts(){
  const pending = allUsers.filter(u => u.status==='pending');
  const others  = allUsers.filter(u => u.status!=='pending')
                          .sort((a,b)=>(a.dealerName||'').localeCompare(b.dealerName||''));

  $('pending-count').textContent = pending.length;
  $('active-count').textContent  = others.length;

  // ── 待開通 ──
  const dealerOpts = dealers
    .filter(d => !d.custody)
    .map(d => {
      const cnt = customers.filter(c => c.did===d.id).length;
      const bound = d.boundUid ? ' · 已綁定' : '';
      return `<option value="${esc(d.id)}" data-name="${esc(d.name)}" data-team="${esc(d.team||'')}"
               ${d.boundUid?'disabled':''}>${esc(d.name)}（${cnt} 位客戶）${bound}</option>`;
    }).join('');
  const teamOpts = teams.map(t=>`<option value="${esc(t.name)}">${esc(t.name)}</option>`).join('');

  $('pending-list').innerHTML = pending.length ? pending.map(u => `
    <div class="pending-card" id="pc-${u.uid}">
      <div class="pc-head">
        <div class="pc-avatar">${avatarHtml(u.photoURL, u.displayName)}</div>
        <div>
          <div class="pc-name">${esc(u.displayName||'（未提供名稱）')}</div>
          <div class="pc-meta">${esc(u.email)} · 申請於 ${fmtDate(u.createdAt)||'—'}</div>
        </div>
      </div>
      <div class="pc-form">
        <div class="field">
          <label>綁定經銷商</label>
          <select id="ap-dealer-${u.uid}" onchange="onApproveDealerChange('${u.uid}')">
            <option value="">— 請選擇 —</option>${dealerOpts}
          </select>
        </div>
        <div class="field">
          <label>角色</label>
          <select id="ap-role-${u.uid}">
            <option value="dealer">健管師</option>
            <option value="leader">團隊長</option>
          </select>
        </div>
        <div class="field">
          <label>團隊</label>
          <select id="ap-team-${u.uid}"><option value="">— 無團隊 —</option>${teamOpts}</select>
        </div>
        <div class="field">
          <label>顯示名稱</label>
          <input type="text" id="ap-name-${u.uid}" placeholder="系統內顯示的名字">
        </div>
      </div>
      <div class="pc-actions">
        <button class="btn sm danger" onclick="rejectUser('${u.uid}')">拒絕</button>
        <button class="btn sm primary" onclick="approveUser('${u.uid}')">確認開通</button>
      </div>
    </div>`).join('')
    : '<div class="empty" style="padding:1.5rem;">目前沒有待開通的申請</div>';

  // ── 已開通 ──
  $('active-list').innerHTML = others.length ? others.map(u => {
    const cnt = customers.filter(c => c.did===u.dealerId).length;
    const dis = u.status==='disabled';
    const canEdit = isSuper() || (u.role!=='admin' && u.role!=='superadmin');
    const acts = [];
    if(canEdit && !dis){
      acts.push(`<button class="btn xs" onclick="editUser('${u.uid}')">編輯</button>`);
      if(u.role==='dealer') acts.push(`<button class="btn xs" onclick="setRole('${u.uid}','leader')">設為團隊長</button>`);
      if(u.role==='leader') acts.push(`<button class="btn xs" onclick="setRole('${u.uid}','dealer')">取消團隊長</button>`);
      if(isSuper() && u.role!=='superadmin')
        acts.push(`<button class="btn xs gold" onclick="setRole('${u.uid}','admin')">升為管理員</button>`);
      if(u.uid!==MY_UID)
        acts.push(`<button class="btn xs danger" onclick="disableUser('${u.uid}')">停用</button>`);
    }
    if(canEdit && dis)
      acts.push(`<button class="btn xs primary" onclick="enableUser('${u.uid}')">恢復</button>`);

    return `<div class="acc-row">
      <div class="acc-avatar">${avatarHtml(u.photoURL, u.dealerName||u.displayName)}</div>
      <div class="acc-info">
        <div class="acc-name">${esc(u.dealerName||u.displayName||'—')}
          <span class="rtag ${dis?'disabled':u.role}">${dis?'已停用':roleLabel(u.role)}</span>
        </div>
        <div class="acc-meta">${esc(u.email)} · ${esc(u.team||'無團隊')} · 客戶 ${cnt} 位</div>
      </div>
      <div class="acc-actions">${acts.join('')}</div>
    </div>`;
  }).join('') : '<div class="empty" style="padding:1.5rem;">尚無已開通帳號</div>';

  // ── 託管客戶 ──
  const custody = customers.filter(c => c.did===CUSTODY_ID);
  $('custody-count').textContent = custody.length;
  if(!custody.length){
    $('custody-panel').innerHTML = '<div class="empty" style="padding:1.5rem;">目前沒有託管中的客戶</div>';
  }else{
    const groups = {};
    custody.forEach(c => {
      const k = c.custodyFromName || '未知來源';
      (groups[k] = groups[k] || []).push(c);
    });
    const assignOpts = dealers.filter(d=>!d.custody && d.active!==false)
      .map(d=>`<option value="${esc(d.id)}" data-name="${esc(d.name)}" data-team="${esc(d.team||'')}">${esc(d.name)}（${esc(d.team||'無團隊')}）</option>`).join('');

    $('custody-panel').innerHTML = Object.entries(groups).map(([from, list], i) => `
      <div style="padding:12px;background:var(--cream);border:1.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;">
        <div style="font-size:13px;font-weight:600;margin-bottom:8px;">
          原屬：${esc(from)} · ${list.length} 位客戶
        </div>
        <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;">
          <div class="field" style="flex:1;min-width:180px;margin:0;">
            <label>指派給</label>
            <select id="cu-target-${i}"><option value="">— 選擇健管師 —</option>${assignOpts}</select>
          </div>
          <button class="btn sm primary" onclick="assignCustody('${esc(from)}', ${i})">確認指派</button>
        </div>
      </div>`).join('');
  }
}

// 選經銷商時自動帶入名稱與團隊
window.onApproveDealerChange = function(uid){
  const sel = $('ap-dealer-'+uid);
  const opt = sel.options[sel.selectedIndex];
  if(!opt || !opt.value) return;
  $('ap-name-'+uid).value = opt.dataset.name || '';
  const teamSel = $('ap-team-'+uid);
  if(opt.dataset.team){
    [...teamSel.options].forEach(o => { if(o.value===opt.dataset.team) teamSel.value = o.value; });
  }
};

window.approveUser = async function(uid){
  const dealerId = $('ap-dealer-'+uid).value;
  const role     = $('ap-role-'+uid).value;
  const team     = $('ap-team-'+uid).value;
  const dname    = $('ap-name-'+uid).value.trim();

  if(!dealerId){ showAlert('error','請選擇要綁定的經銷商'); return; }
  if(!dname){ showAlert('error','請填寫顯示名稱'); return; }

  try{
    const batch = writeBatch(db);
    batch.update(doc(db,'users',uid), {
      role, status:'active', dealerId, dealerName:dname,
      team: team || null,
      approvedAt: serverTimestamp(),
      approvedBy: ME.email || ''
    });
    batch.update(doc(db,'dealers',dealerId), { boundUid: uid });
    if(role==='leader' && team){
      const t = teams.find(x => x.name===team);
      if(t) batch.update(doc(db,'teams',t.id), { leaderUid: uid });
    }
    await batch.commit();
    showAlert('success','✓ 已開通 '+esc(dname));
    await reloadAll();
  }catch(e){
    showAlert('error','開通失敗：'+esc(e.message||e));
  }
};

window.rejectUser = async function(uid){
  const u = allUsers.find(x=>x.uid===uid);
  if(!confirm(`確定拒絕「${u?.displayName||u?.email}」的申請？\n\n該帳號將被標記為停用。`)) return;
  try{
    await updateDoc(doc(db,'users',uid), { status:'disabled' });
    showAlert('success','已拒絕該申請');
    await reloadAll();
  }catch(e){ showAlert('error','操作失敗：'+esc(e.message||e)); }
};

window.setRole = async function(uid, role){
  const u = allUsers.find(x=>x.uid===uid);
  const labels = {leader:'團隊長', dealer:'健管師', admin:'管理員'};
  if(!confirm(`確定將「${u?.dealerName||u?.email}」設為${labels[role]}？`)) return;
  try{
    const batch = writeBatch(db);
    batch.update(doc(db,'users',uid), { role });
    if(u?.team){
      const t = teams.find(x => x.name===u.team);
      if(t){
        if(role==='leader') batch.update(doc(db,'teams',t.id), { leaderUid: uid });
        else if(t.leaderUid===uid) batch.update(doc(db,'teams',t.id), { leaderUid: null });
      }
    }
    await batch.commit();
    showAlert('success','✓ 已更新權限');
    await reloadAll();
  }catch(e){ showAlert('error','更新失敗：'+esc(e.message||e)); }
};

window.editUser = async function(uid){
  const u = allUsers.find(x=>x.uid===uid);
  if(!u) return;
  const newName = prompt('顯示名稱：', u.dealerName || '');
  if(newName===null) return;
  const teamNames = teams.map(t=>t.name);
  const newTeam = prompt('團隊（留空表示無團隊）\n可用：'+teamNames.join('、'), u.team || '');
  if(newTeam===null) return;
  if(newTeam && !teamNames.includes(newTeam)){
    showAlert('error','找不到團隊「'+esc(newTeam)+'」'); return;
  }
  try{
    await updateDoc(doc(db,'users',uid), {
      dealerName: newName.trim(),
      team: newTeam.trim() || null
    });
    showAlert('success','✓ 已更新');
    await reloadAll();
  }catch(e){ showAlert('error','更新失敗：'+esc(e.message||e)); }
};

// 停用 → 客戶自動託管
window.disableUser = async function(uid){
  const u = allUsers.find(x=>x.uid===uid);
  if(!u) return;
  const mine = customers.filter(c => c.did===u.dealerId);
  if(!confirm(
    `確定停用「${u.dealerName||u.email}」？\n\n`+
    `· 該帳號將無法登入使用系統\n`+
    `· 名下 ${mine.length} 位客戶將轉入「託管中」\n`+
    `· 之後可在託管區塊指派給其他健管師`
  )) return;

  try{
    // 客戶轉託管（分批，每批 400）
    for(let i=0; i<mine.length; i+=400){
      const chunk = mine.slice(i, i+400);
      const b = writeBatch(db);
      chunk.forEach(c => b.update(doc(db,'customers',c.id), {
        did: CUSTODY_ID,
        dname: '託管中',
        custodyFrom: u.dealerId || '',
        custodyFromName: u.dealerName || u.displayName || '',
        updatedAt: serverTimestamp()
      }));
      await b.commit();
    }

    const b2 = writeBatch(db);
    b2.update(doc(db,'users',uid), { status:'disabled' });
    if(u.dealerId) b2.update(doc(db,'dealers',u.dealerId), { active:false, boundUid:null });
    if(u.dealerId) b2.set(doc(db,'dealerStats',u.dealerId), {
      dealerId:u.dealerId, dealerName:u.dealerName||'', team:u.team||'',
      customerCount:0, task1Count:0, task2Count:0, task3Count:0, allTasksCount:0,
      urgentCount:0, invitationCounts:{}, healthCounts:{},
      purchaseDayTotal:0, purchase7dTotal:0, updatedAt: serverTimestamp()
    });
    await b2.commit();

    if(mine.length){
      await addDoc(collection(db,'actionLogs'), {
        type:'transfer_customers',
        operatorUid: MY_UID, operatorEmail: ME.email||'', operatorRole: ME.role,
        targetInfo:{
          fromDealerId: u.dealerId||'', fromName: u.dealerName||'',
          toDealerId: CUSTODY_ID, toName:'託管中',
          count: mine.length, reason:'帳號停用'
        },
        createdAt: serverTimestamp()
      });
    }

    showAlert('success', `✓ 已停用，${mine.length} 位客戶轉入託管`);
    await reloadAll();
  }catch(e){ showAlert('error','停用失敗：'+esc(e.message||e)); }
};

window.enableUser = async function(uid){
  const u = allUsers.find(x=>x.uid===uid);
  if(!confirm(`確定恢復「${u?.dealerName||u?.email}」的帳號？\n\n注意：原本的客戶仍在託管中，需另外指派回去。`)) return;
  try{
    const b = writeBatch(db);
    b.update(doc(db,'users',uid), { status:'active' });
    if(u.dealerId) b.update(doc(db,'dealers',u.dealerId), { active:true, boundUid:uid });
    await b.commit();
    showAlert('success','✓ 已恢復帳號');
    await reloadAll();
  }catch(e){ showAlert('error','操作失敗：'+esc(e.message||e)); }
};

// 託管客戶指派
window.assignCustody = async function(fromName, idx){
  const sel = $('cu-target-'+idx);
  const targetId = sel.value;
  if(!targetId){ showAlert('error','請先選擇要指派的健管師'); return; }
  const opt = sel.options[sel.selectedIndex];
  const targetName = opt.dataset.name || '';
  const targetTeam = opt.dataset.team || '';

  const list = customers.filter(c => c.did===CUSTODY_ID && (c.custodyFromName||'未知來源')===fromName);
  if(!confirm(`確定將「${fromName}」的 ${list.length} 位客戶指派給「${targetName}」？`)) return;

  try{
    for(let i=0; i<list.length; i+=400){
      const chunk = list.slice(i, i+400);
      const b = writeBatch(db);
      chunk.forEach(c => b.update(doc(db,'customers',c.id), {
        did: targetId, dname: targetName, team: targetTeam,
        custodyFrom: null, custodyFromName: null,
        updatedAt: serverTimestamp()
      }));
      await b.commit();
    }
    await addDoc(collection(db,'actionLogs'), {
      type:'transfer_customers',
      operatorUid: MY_UID, operatorEmail: ME.email||'', operatorRole: ME.role,
      targetInfo:{
        fromDealerId: CUSTODY_ID, fromName,
        toDealerId: targetId, toName: targetName,
        count: list.length, reason:'託管指派'
      },
      createdAt: serverTimestamp()
    });
    showAlert('success', `✓ 已將 ${list.length} 位客戶指派給 ${esc(targetName)}`);
    await reloadAll();
  }catch(e){ showAlert('error','指派失敗：'+esc(e.message||e)); }
};
</script>
